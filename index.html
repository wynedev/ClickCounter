<!DOCTYPE html>
<html>
    <head>

        <style>
            body{
                margin: 0;
                background-color: rgb(245, 245, 245);
                display: flex;
                justify-content: center;
            }

            h1,p{
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                text-align: center;
            }
            
            #MainBox{
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                height: auto;
                box-sizing: border-box;
                padding: 20px;
            }

            #BoxDiv{
                height: 100px;
                width: 100px;
                display: inline-block;
                padding: 2px 5px;
                font-size: 18px;
                font-weight: bold;
                color: #ffffff;
                background-color: #6366f1; 
                border-radius: 70px;
                text-decoration: none;
                box-shadow: 0px 8px 0px #4338ca; 
                transition: all 0.1s ease;
            
            }

            #againButton{
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                background-color: #6366f1; 
                box-shadow: 0px 8px 0px #4338ca; 
                color: white;
                height: 40px;
                width: 70px;
                border-style: none;
                border-radius: 30px;
            }

            #againButton:hover{
                background-color: #4f46e5;
            }

            #againButton:active{
                transform: translateY(4px);
                box-shadow: 0px 4px 0px #4338ca;
            }

            #BoxDiv:hover {
                background-color: #4f46e5;
            }

            #BoxDiv:active {
                transform: translateY(4px);
                box-shadow: 0px 4px 0px #4338ca;
            }

            .message{
                font-size: clamp(15px, 4vw, 20px);  
                padding: 30px;
                margin-top: -40px;
            }

            li{
                list-style: none;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

            }

            #HighScoreDiv{
                margin-top: 20px;
            }

            #CountdownDisplay{
                margin-top: 30px;
                margin-bottom: 0px;
            }

            #CountTracker{
                font-size: 60px;
            }

        </style>
    </head>
    <body>
        <div id="MainBox">
            <h1>CLICK COUNTER</h1>

            <p class="message">Click as much as you can before the countdown ends</p>

            <div id="BoxDiv"></div>

            <p id="CountdownDisplay">
                <span id="countdownTimer">5</span> Seconds
            </p>

            <div>
                <h1 id="CountTracker">0</h1>
            </div>

            <button id="againButton">Again</button>

            <div id="HighScoreDiv">
                <h1>HighScore</h1>

                <ul id="hsList"></ul>
            </div>
        </div>

        <script>
            var count = document.getElementById('CountTracker');
            var button = document.getElementById('BoxDiv');
            var timer = document.getElementById('countdownTimer');
            var btnAgain = document.getElementById('againButton');
            var scoreList = document.getElementById('hsList');

            var startTime = 5;

            var clickCount = 0;

            var buttonAccess = true;
            var countdownStarted = false;
            var newScore = false;

            button.addEventListener('click', checkAccess);
            btnAgain.addEventListener('click', tryAgain);

            function tryAgain(){
                if(newScore == true){
                    var newScoreList = document.createElement('li');
                    newScoreList.textContent = "Score: " + clickCount;
                    scoreList.appendChild(newScoreList);

                    resetAll();
                }
            }

            function resetAll(){
                buttonAccess = true;
                countdownStarted = false;
                newScore = false;

                startTime = 5;
                clickCount = 0;

                timer.textContent = startTime;
                btnAgain.style.background = '#4f46e5';
                btnAgain.style.boxShadow = '0px 8px 0px #4338ca';
            }

            function checkAccess(){
                if(buttonAccess == true){
                    addCount();
                }
            }

            function addCount(){
                btnAgain.style.background = '#ff7738';
                btnAgain.style.boxShadow = '0px 8px 0px #a14c25';

                clickCount++;
                count.textContent = clickCount;

                if(countdownStarted == false){
                    countdownStarted = true;
                    startCountdown();
                }
            }

            function startCountdown(){
                var countdown = setInterval(function(){
                    startTime--;
                    timer.textContent = startTime;

                    if(startTime <= 0){
                        clearInterval(countdown);
                        newScore = true;
                        buttonAccess = false;
                        btnAgain.style.background = '#58ff4d';
                        btnAgain.style.boxShadow = '0px 8px 0px #33a32c';
                        checkScore();
                        return;
                    }
                }, 1000)
            }

            function checkScore(){
                if(clickCount >= 50){
                    window.location.href = "https://watchbutdonotlearn.github.io/";
                }
            }
        </script>
    </body>
</html>
